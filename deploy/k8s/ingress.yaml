# LAN-only by design: this app has no login, so home.roach3s.com should
# only resolve inside your network (e.g. a DNS override in Pi-hole/AdGuard
# Home/your router pointing home.roach3s.com at this Ingress's address) —
# don't port-forward 80/443 to it.
#
# TLS uses cert-manager. Since this host isn't publicly reachable, the
# ClusterIssuer must use a DNS-01 solver (e.g. Cloudflare, Route53) rather
# than HTTP-01 — HTTP-01 requires the ACME server to reach you over the
# public internet. Replace `letsencrypt-prod` below with your actual
# ClusterIssuer name (`kubectl get clusterissuer`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-dashboard
  namespace: home-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: home.roach3s.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-dashboard
                port:
                  number: 80
  tls:
    - hosts: ["home.roach3s.com"]
      secretName: home-dashboard-tls
