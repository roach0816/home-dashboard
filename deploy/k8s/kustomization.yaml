apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-dashboard
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
# Ingress is deliberately NOT listed here — see ingress.example.yaml.
# The public hostname is cluster/environment config, not application code,
# so it's created directly in Rancher/kubectl rather than tracked in git.
