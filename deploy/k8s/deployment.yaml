apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-dashboard
  namespace: home-dashboard
  labels:
    app: home-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume backs the bookmark data, so avoid two pods mounting it at once
  selector:
    matchLabels:
      app: home-dashboard
  template:
    metadata:
      labels:
        app: home-dashboard
    spec:
      containers:
        - name: home-dashboard
          # Pinned to a commit SHA (not :latest) and kept in sync by CI — see
          # .github/workflows/docker-publish.yml. This is what makes deploys
          # actually roll out: Fleet only re-applies a Deployment when its
          # manifest content changes, and ":latest" never changes as text
          # even when the image behind it does.
          image: ghcr.io/roach0816/home-dashboard:c3f94b12bf3f03718807123dd10518631ef3f622
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATA_DIR
              value: /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: home-dashboard-data
