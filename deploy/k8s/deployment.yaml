apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-dashboard
  namespace: home-dashboard
  labels:
    app: home-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume backs the bookmark data, so avoid two pods mounting it at once
  selector:
    matchLabels:
      app: home-dashboard
  template:
    metadata:
      labels:
        app: home-dashboard
    spec:
      # Binds the pod directly to its node's network namespace instead of
      # Flannel's overlay, so it can receive LAN broadcast traffic (e.g. the
      # Tempest Hub's UDP current-conditions broadcasts on port 50222) —
      # overlay CNIs don't forward broadcast/multicast from the physical LAN.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: home-dashboard
          # Pinned to a commit SHA (not :latest) and kept in sync by CI — see
          # .github/workflows/docker-publish.yml. This is what makes deploys
          # actually roll out: Fleet only re-applies a Deployment when its
          # manifest content changes, and ":latest" never changes as text
          # even when the image behind it does.
          image: ghcr.io/roach0816/home-dashboard:2a51fe6e6c132100b552f31078140b77b0883cb4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATA_DIR
              value: /app/data
            # hostNetwork: true makes Kubernetes set this pod's hostname to
            # the node's hostname, which the container runtime then injects
            # as $HOSTNAME. Next's standalone server binds to $HOSTNAME
            # verbatim when it's set (falling back to 0.0.0.0 otherwise),
            # so without this override it tries to bind to the node's
            # hostname instead of all interfaces and nothing can reach it.
            - name: HOSTNAME
              value: "0.0.0.0"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: home-dashboard-data
