name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # arm64 covers Raspberry Pi (and other ARM) nodes; amd64 covers everything else.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/home-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/home-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the Deployment to this commit's image and commit that back to
      # main. This is what actually triggers a rollout: Fleet (or any
      # GitOps tool) only re-applies a resource when its manifest content
      # changes, and ":latest" is the same text every time even though the
      # image behind it changed — pushing a new image alone never bounces
      # the running pod. [skip ci] avoids re-triggering this workflow.
      - name: Pin deployment to this build
        run: |
          sed -i "s|image: ghcr.io/[^:]*/home-dashboard:.*|image: ghcr.io/${{ github.repository_owner }}/home-dashboard:${{ github.sha }}|" deploy/k8s/deployment.yaml
          if git diff --quiet; then
            echo "Deployment already pinned to this commit; nothing to do."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add deploy/k8s/deployment.yaml
            git commit -m "chore: deploy home-dashboard@${{ github.sha }} [skip ci]"
            git push
          fi
